# Mirrors the devcontainer's Node-based Playwright development environment locally.
[tools]
node = "lts"
# Required to match the devcontainer GitHub CLI feature.
"aqua:cli/cli" = "latest"
# Required to match the devcontainer Copilot CLI feature.
"aqua:github/copilot-cli" = "latest"

[tasks.init]
alias = "setup"
description = "Install local dependencies and Playwright browsers"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules"]
run = [
  "npm ci",
  "npx playwright install",
]

[tasks.test]
description = "Run Playwright tests"
depends = ["init"]
run = "npm test"

[tasks.clean]
description = "Remove local install and Playwright-generated artifacts"
run = """
rm -rf \
  node_modules \
  test-results \
  .playwright-cli \
  .playwright-mcp \
  generated.spec.ts \
  playwright-report
"""
